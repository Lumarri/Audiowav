name: Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: cmake -S native_tests -B build/native-windows -A x64
      - run: cmake --build build/native-windows --config Release
      - run: ctest --test-dir build/native-windows -C Release --output-on-failure
      - run: flutter build windows --release
      - run: powershell -ExecutionPolicy Bypass -File tool/package_windows.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: Audiowav-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
